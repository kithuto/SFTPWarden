{{- if or .Values.provider.createDsnSecret .Values.provider.dsnSecretValue -}}
{{- fail "Provider credentials cannot be rendered into Helm output. Create the Secret privately and set provider.dsnSecretName." -}}
{{- end -}}
{{- $name := include "sftpwarden.name" . -}}
{{- $namespace := include "sftpwarden.namespace" . -}}
{{- $receipt := lookup "v1" "ConfigMap" $namespace (printf "%s-identity-prepared" $name) | default dict -}}
{{- $data := get $receipt "data" | default dict -}}
{{- $legacy := get $data "legacySecretName" | default (printf "%s-host-keys" $name) -}}
{{- $secret := lookup "v1" "Secret" $namespace $legacy | default dict -}}
{{- $metadata := get $secret "metadata" | default dict -}}
{{- $annotations := get $metadata "annotations" | default dict -}}
{{- if and (eq (get $annotations "meta.helm.sh/release-name") .Release.Name) (eq (get $annotations "meta.helm.sh/release-namespace") .Release.Namespace) }}
# Retain the legacy resource without rendering or replacing private data.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $legacy }}
  namespace: {{ $namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "sftpwarden.labels" . | nindent 4 }}
type: Opaque
{{- end }}
{{- $providerNames := list -}}
{{- if .Values.provider.dsnSecretName -}}{{- $providerNames = append $providerNames .Values.provider.dsnSecretName -}}{{- end -}}
{{- $oldWorkload := lookup "apps/v1" "StatefulSet" $namespace $name -}}
{{- if $oldWorkload -}}
{{- range $oldWorkload.spec.template.spec.containers -}}
{{- if eq .name "sftpwarden" -}}
{{- range .env -}}
{{- if and (eq .name "SFTPWARDEN_PROVIDER_DSN") (hasKey . "valueFrom") -}}
{{- if hasKey .valueFrom "secretKeyRef" -}}{{- $providerNames = append $providerNames .valueFrom.secretKeyRef.name -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range ($providerNames | uniq) -}}
{{- $providerName := . -}}
{{- $providerSecret := lookup "v1" "Secret" $namespace $providerName | default dict -}}
{{- $providerMetadata := get $providerSecret "metadata" | default dict -}}
{{- $providerAnnotations := get $providerMetadata "annotations" | default dict -}}
{{- if and (eq (get $providerAnnotations "meta.helm.sh/release-name") $.Release.Name) (eq (get $providerAnnotations "meta.helm.sh/release-namespace") $.Release.Namespace) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $providerName }}
  namespace: {{ $namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "sftpwarden.labels" $ | nindent 4 }}
type: Opaque
{{- end }}
{{- end }}
