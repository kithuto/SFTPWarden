{{- $probes := .Values.probes | default dict -}}
{{- $startupProbe := get $probes "startup" | default dict -}}
{{- $readinessProbe := get $probes "readiness" | default dict -}}
{{- $livenessProbe := get $probes "liveness" | default dict -}}
{{- $fileProvider := has .Values.provider.type (list "yaml" "csv" "sqlite") -}}
{{- $runtimeConfig := fromYaml .Values.sftpwardenConfig -}}
{{- $server := get $runtimeConfig "server" | default dict -}}
{{- include "sftpwarden.identityPreflight" . -}}
# Offline templates do not verify live identity. Prepare before apply; activate explicitly.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sftpwarden.name" . }}
  namespace: {{ include "sftpwarden.namespace" . }}
  labels:
    {{- include "sftpwarden.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "sftpwarden.name" . }}
  replicas: {{ .Values.runtime.replicas }}
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "sftpwarden.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        sftpwarden.io/config-revision: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        sftpwarden.io/activation: "explicit-identity-preflight-required"
      labels:
        {{- include "sftpwarden.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: host-key-bootstrap
          image: "{{ include "sftpwarden.image" . }}"
          command:
            - sh
            - -c
            - |
              set -eu
              python -m sftpwarden.runtime.host_keys --directory /host-keys --state /previous-state{{ if .Values.hostKeys.secretName }} --secret "$SFTPWARDEN_HOST_KEY_SECRET"{{ end }}
              {{- if $fileProvider }}
              python -m sftpwarden.runtime.bootstrap_provider --config /config/sftpwarden.yaml
              {{- end }}
          {{- if .Values.hostKeys.secretName }}
          env:
            - name: SFTPWARDEN_HOST_KEY_SECRET
              value: {{ .Values.hostKeys.mountPath | quote }}
          {{- end }}
          volumeMounts:
            - name: host-keys
              mountPath: /host-keys
            - name: state
              mountPath: /previous-state
              readOnly: true
            {{- if .Values.hostKeys.secretName }}
            - name: host-key-secret
              mountPath: {{ .Values.hostKeys.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $fileProvider }}
            - name: provider
              mountPath: /etc/sftpwarden/provider-data
            {{- end }}
            {{- if $fileProvider }}
            - name: config
              mountPath: /config
              readOnly: true
            {{- end }}
      containers:
        - name: sftpwarden
          image: "{{ include "sftpwarden.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sftp
              containerPort: 22
          env:
            - name: SFTPWARDEN_CONFIG
              value: /etc/sftpwarden/sftpwarden.yaml
            {{- if .Values.provider.dsnSecretName }}
            - name: {{ .Values.provider.dsnSecretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.provider.dsnSecretName }}
                  key: {{ .Values.provider.dsnSecretKey }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/sftpwarden/sftpwarden.yaml
              subPath: sftpwarden.yaml
              readOnly: true
            - name: data
              mountPath: {{ default "/data" (get $server "data_dir") | quote }}
            - name: state
              mountPath: {{ default "/var/lib/sftpwarden" (get $server "state_dir") | quote }}
            - name: host-keys
              mountPath: {{ default "/etc/sftpwarden/host_keys" (get $server "host_keys_dir") | quote }}
            {{- if .Values.persistence.provider.enabled }}
            - name: provider
              mountPath: /etc/sftpwarden/provider-data
            {{- end }}
          startupProbe:
            exec:
              command: ["sftpwarden", "runtime", "health", "--config", "/etc/sftpwarden/sftpwarden.yaml", "--probe", "startup"]
            failureThreshold: {{ default 30 (get $startupProbe "failureThreshold") }}
            periodSeconds: {{ default 5 (get $startupProbe "periodSeconds") }}
            timeoutSeconds: {{ default 5 (get $startupProbe "timeoutSeconds") }}
          readinessProbe:
            exec:
              command: ["sftpwarden", "runtime", "health", "--config", "/etc/sftpwarden/sftpwarden.yaml", "--probe", "readiness"]
            failureThreshold: {{ default 3 (get $readinessProbe "failureThreshold") }}
            periodSeconds: {{ default 10 (get $readinessProbe "periodSeconds") }}
            timeoutSeconds: {{ default 5 (get $readinessProbe "timeoutSeconds") }}
          livenessProbe:
            exec:
              command: ["sftpwarden", "runtime", "health", "--config", "/etc/sftpwarden/sftpwarden.yaml", "--probe", "liveness"]
            failureThreshold: {{ default 3 (get $livenessProbe "failureThreshold") }}
            periodSeconds: {{ default 30 (get $livenessProbe "periodSeconds") }}
            timeoutSeconds: {{ default 5 (get $livenessProbe "timeoutSeconds") }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "SYS_CHROOT"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "sftpwarden.name" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sftpwarden.name" . }}-data
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "sftpwarden.name" . }}-state
        - name: host-keys
          {{- if .Values.hostKeys.secretName }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "sftpwarden.name" . }}-host-keys
          {{- end }}
        {{- if .Values.hostKeys.secretName }}
        - name: host-key-secret
          secret:
            secretName: {{ .Values.hostKeys.secretName }}
            defaultMode: 0600
        {{- end }}
        {{- if .Values.persistence.provider.enabled }}
        - name: provider
          persistentVolumeClaim:
            claimName: {{ include "sftpwarden.name" . }}-provider
        {{- end }}
