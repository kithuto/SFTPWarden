name: Security

on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mysql,postgres,mongodb]" pip-audit

      - name: Audit Python dependencies
        run: pip-audit

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build runtime image
        run: docker build -t sftpwarden:security -f docker/runtime/Dockerfile .

      - name: Build watcher image
        run: docker build -t sftpwarden-watcher:security -f docker/watcher/Dockerfile .

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sftpwarden:security
          format: json
          output: trivy-runtime.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false

      - name: Scan watcher image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sftpwarden-watcher:security
          format: json
          output: trivy-watcher.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false

      - name: Generate runtime SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sftpwarden:security
          output-file: runtime-sbom.spdx.json

      - name: Generate watcher SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sftpwarden-watcher:security
          output-file: watcher-sbom.spdx.json

      - name: Publish complete reports and enforce container policy
        id: container-policy
        if: always()
        shell: bash
        run: |
          # Reuse each scan: retain all findings in SARIF, but block HIGH/CRITICAL.
          # Inspect both images and fail closed on missing or invalid reports.
          status=0
          for image in runtime watcher; do
            trivy convert --format sarif --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 \
              --output "trivy-$image.sarif" "trivy-$image.json" || status=1
            trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 \
              "trivy-$image.json" || status=1
          done
          exit "$status"

      - name: Upload security reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            runtime-sbom.spdx.json
            watcher-sbom.spdx.json
            trivy-runtime.json
            trivy-watcher.json
            trivy-runtime.sarif
            trivy-watcher.sarif

  publish-sarif:
    needs: container-scan
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download reports without executing contributor code
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-reports
          path: reports
      - name: Upload runtime scan
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: reports/trivy-runtime.sarif
          category: trivy-runtime
      - name: Upload watcher scan
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: reports/trivy-watcher.sarif
          category: trivy-watcher

  scorecard:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard.sarif
