name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
          - python-version: "3.14"
            tox-env: py314
          - os: ubuntu-latest
            python-version: "3.14"
            tox-env: coverage

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run tests
        id: tests
        run: tox -e ${{ matrix.tox-env }} -- --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: error

  quality:
    name: Lint, type check, docs, audit and examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install tox and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
          python -m pip install -e ".[mysql,postgres,mongodb]"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run lint, type, docs and audit checks
        run: tox -e lint,mypy,docs,audit

      - name: Validate examples
        run: |
          sftpwarden validate --config examples/yaml/sftpwarden.yaml
          sftpwarden validate --config examples/csv/sftpwarden.yaml
          sftpwarden validate --config examples/sqlite/sftpwarden.yaml
          SFTPWARDEN_MYSQL_DSN=mysql://user:pass@localhost/sftp sftpwarden validate --config examples/mysql/sftpwarden.yaml
          SFTPWARDEN_MARIADB_DSN=mariadb://user:pass@localhost/sftp sftpwarden validate --config examples/mariadb/sftpwarden.yaml
          SFTPWARDEN_POSTGRES_DSN=postgresql://user:pass@localhost/sftp sftpwarden validate --config examples/postgres/sftpwarden.yaml
          SFTPWARDEN_MONGODB_DSN=mongodb://localhost:27017/sftp sftpwarden validate --config examples/mongodb/sftpwarden.yaml

      - name: Validate compose generation
        run: |
          sftpwarden compose --config examples/yaml/sftpwarden.yaml > /tmp/sftpwarden-compose.yml
          test -s /tmp/sftpwarden-compose.yml

      - name: Validate Kubernetes chart and manifests
        run: |
          helm lint charts/sftpwarden
          helm template sftpwarden charts/sftpwarden > /tmp/sftpwarden-chart.yml
          test -s /tmp/sftpwarden-chart.yml
          mkdir -p /tmp/sftpwarden-kube
          sftpwarden init kube --root /tmp/sftpwarden-kube --deploy kube --yes --skip-checks
          sftpwarden kube render --config /tmp/sftpwarden-kube/sftpwarden.yaml > /tmp/sftpwarden-kube.yml
          test -s /tmp/sftpwarden-kube.yml
