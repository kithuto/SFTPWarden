name: Candidate images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  images:
    name: Build and verify ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      SFTPWARDEN_TEST_INSTALLED_ARTIFACT: "1"
      SFTPWARDEN_DISPOSABLE_SYSTEMD_RUNNER: "1"
      SFTPWARDEN_RELEASE_RUNTIME_IMAGE: sftpwarden-candidate:${{ github.sha }}-${{ matrix.arch }}
      SFTPWARDEN_RELEASE_WATCHER_IMAGE: sftpwarden-watcher-candidate:${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-packages
          path: dist
      - name: Verify candidate package bytes
        run: python tools/release_artifacts.py verify dist --commit "$GITHUB_SHA"
      - name: Build each image once from the candidate wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker build --target runtime-wheel --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$SFTPWARDEN_RELEASE_RUNTIME_IMAGE" -f docker/runtime/Dockerfile .
          docker build --target watcher-wheel --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$SFTPWARDEN_RELEASE_WATCHER_IMAGE" -f docker/watcher/Dockerfile .
      - name: Install the candidate, not an editable checkout
        run: |
          python -m pip install --constraint docker/release-constraints.txt "$(find dist -maxdepth 1 -name '*.whl')[mysql,postgres,mongodb]" pytest pip-audit
          python -I -c "import pathlib,sftpwarden; assert not pathlib.Path(sftpwarden.__file__).is_relative_to(pathlib.Path.cwd())"
          python -m pip_audit
      - name: Check bounded load before the expensive external groups
        run: |
          python -I tools/run_release_gates.py load --junitxml=load-results.xml -o junit_family=xunit1 -vv --tb=short
      - name: Verify watcher artifact
        run: docker run --rm --entrypoint sftpwarden "$SFTPWARDEN_RELEASE_WATCHER_IMAGE" --version
      - name: Record the tested runtime dependency inventory
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.SFTPWARDEN_RELEASE_RUNTIME_IMAGE }}
          output-file: runtime-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record the tested watcher dependency inventory
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.SFTPWARDEN_RELEASE_WATCHER_IMAGE }}
          output-file: watcher-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Save the candidate images for parallel validation without rebuilding
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir candidate-images
          docker save "$SFTPWARDEN_RELEASE_RUNTIME_IMAGE" | gzip -n > "candidate-images/runtime-$ARCH.tar.gz"
          docker save "$SFTPWARDEN_RELEASE_WATCHER_IMAGE" | gzip -n > "candidate-images/watcher-$ARCH.tar.gz"
          docker image inspect "$SFTPWARDEN_RELEASE_RUNTIME_IMAGE" "$SFTPWARDEN_RELEASE_WATCHER_IMAGE" > candidate-images/image-identities.json
          cp runtime-sbom.spdx.json watcher-sbom.spdx.json load-results.xml candidate-images/
          python tools/release_artifacts.py record candidate-images --commit "$GITHUB_SHA" --version "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-images-${{ matrix.arch }}
          path: candidate-images/*
          if-no-files-found: error
      - name: Retain failure evidence without test homes or credentials
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-failure-${{ matrix.arch }}
          path: |
            load-results.xml
